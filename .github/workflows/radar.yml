name: radar
# Cloud runner. GitHub's own cron only fires every few hours for high-frequency schedules, so each
# run schedules the next one itself (~5 min apart; ~8 min while the Mac runner is live and this run
# just stands by). The cron below only restarts the loop if it ever breaks.
# Pause the loop: repo Settings → Variables → RADAR_LOOP = off.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the Mac runner is live
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Note start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sweep and publish
        id: sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node radar/run.mjs once --runner actions ${{ inputs.force && '--force' || '' }}
      - name: Schedule the next run
        if: always() && vars.RADAR_LOOP != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ steps.sweep.outputs.skipped }}
        run: |
          spacing=$([ "$SKIPPED" = "true" ] && echo 470 || echo 285)
          wait=$(( spacing - ( $(date +%s) - RUN_START ) ))
          [ "$wait" -gt 0 ] && sleep "$wait"
          waiting=$(gh run list --workflow radar.yml --limit 20 --json status \
            -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$waiting" = "0" ]; then
            gh workflow run radar.yml --ref main
            echo "next run dispatched"
          else
            echo "a run is already queued ($waiting); not dispatching another"
          fi
