name: radar
# Cloud runner: sweeps every career site that's due and publishes to the `data` branch.
# It stands down automatically while the Mac runner is live (the Mac polls every ~minute).

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the Mac runner is live
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sweep and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node radar/run.mjs once --runner actions ${{ inputs.force && '--force' || '' }}
