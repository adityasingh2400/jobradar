name: test
on:
  push:
    branches: [main]
    paths: ['radar/**', 'test/**', 'config/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/engine.test.mjs
      - run: node test/classify.test.mjs
      - name: All adapters load
        run: node -e "import('./radar/sources/index.mjs').then(m=>m.loadAdapters()).then(a=>{console.log(a.length,'sources');if(a.length<40)process.exit(1)})"
